*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{display:grid;grid-template-columns:var(--nw,248px) 1fr var(--sw,330px);grid-template-rows:46px 1fr;height:100%;position:relative}
body.noNav #app{--nw:0px}body.noSide #app{--sw:0px}
body.noNav #nav,body.noSide #side{display:none}
body.narrow #app{--nw:0px;--sw:0px}
body.narrow #nav,body.narrow #side{position:absolute;top:46px;bottom:0;z-index:30;width:min(330px,90vw);box-shadow:var(--shadow)}
body.narrow #nav{left:0}body.narrow #side{right:0}
#top{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}

#brand{display:flex;align-items:baseline;gap:7px;white-space:nowrap;flex:none}
.cf{font:italic 400 18px/1 'EB Garamond',Garamond,Georgia,serif;color:var(--brand)}
#brand span{font:600 9.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--sub)}
.cf{flex:none}.cf.cfS{display:none}
@media (max-width:520px){.cf.cfF{display:none}.cf.cfS{display:inline}#top{gap:6px}#top .seg{flex:none}#top .seg button{padding:6px 6px;font-size:12.5px}#title{min-width:0}#top .btn{padding-left:8px;padding-right:8px}}
@media (max-width:379px){.cf.cfS{display:none}}
#title{flex:0 1 240px;min-width:60px;background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 7px;font-weight:600;font-size:14px}
#title:hover,#title:focus{border-color:var(--line);background:var(--paper)}
#stats{font:12px var(--mono);color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 0;min-width:0}
#save{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sub);white-space:nowrap}
#save i{width:7px;height:7px;border-radius:50%;background:var(--good)}
#save.busy i{background:var(--warn)}#save.warn i{background:var(--bad)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:6px 11px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentInk);font-weight:600}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:6px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.ib{border:1px solid transparent;background:transparent;border-radius:7px;padding:6px 8px;line-height:0;color:var(--sub)}
.ib:hover,.ib.on{background:var(--panel2);color:var(--ink)}
.ib.on{border-color:var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:6px 11px;font-weight:500}

  .el.t-h::before{position:static;display:inline;width:auto;margin-right:.6em}

<script>
/* ============================================================
   Parsing: text / Fountain, Final Draft (.fdx), PDF
   Elements: {t,x,pg,row,n,num}  t: h heading, a action, c character, d dialogue, p parenthetical, tr transition
   ============================================================ */
const HEAD=/^(?:(\d+[A-Z]{0,2})\.?\s+)?((?:INT|EXT|EST|I\/E)(?:\.|(?=[\s\/]))(?:\s*\/\s*(?:INT|EXT)\.?)?)\s*(.*?)\s*$/;
const isUpper=s=>s===s.toUpperCase()&&/[A-Z]/.test(s);
const isCue=s=>isUpper(s)&&s.length<=42&&!/[.!?,:;]$/.test(s.replace(/\(.*?\)\s*\^?$/,'').trim())&&!HEAD.test(s);
const JUNK=/^(\(?CONTINUED\)?:?(\s*\(\d+\))?|\(MORE\)|\(CONT(INUED|'D)\))$/i;
function headEl(s,raw){const m=s.match(HEAD);if(!m)return null;let x=(m[2]+' '+m[3]).replace(/\s+/g,' ').trim(),num=m[1]||'';
  const t=x.match(/^(.*?)\s+(\d+[A-Z]{0,2})\.?$/);if(t&&(t[2]===num||(raw&&/\s{3,}\d+[A-Z]{0,2}\.?\s*$/.test(raw)))){x=t[1].trim();num=num||t[2];}
  return {t:'h',x,num};}
function parseSlug(x){const m=x.match(/^(INT\.?\s*\/\s*EXT\.?|EXT\.?\s*\/\s*INT\.?|I\/E\.?|INT\.?|EXT\.?|EST\.?)\s*[-.:]?\s*(.*)$/);if(!m){const k0=Math.max(x.lastIndexOf(' - '),x.lastIndexOf(' – '),x.lastIndexOf(' — '));return k0>0?{ie:'',set:x.slice(0,k0).trim(),tod:x.slice(k0+3).trim()}:{ie:'',set:x,tod:''};}
  let ie=m[1].replace(/\s+/g,'').replace(/\.$/,'').toUpperCase();if(ie==='I/E')ie='INT/EXT';ie=ie.replace(/\./g,'');let rest=m[2].trim(),tod='';const k=Math.max(rest.lastIndexOf(' - '),rest.lastIndexOf(' – '),rest.lastIndexOf(' — '));
  if(k>0){tod=rest.slice(k+3).trim();rest=rest.slice(0,k).trim();}return {ie,set:rest,tod};}
const cueName=x=>x.replace(/\s*\([^)]*\)\s*/g,' ').replace(/\^\s*$/,'').replace(/\s+CONT['’]?D\.?\s*$/i,'').replace(/\s+/g,' ').trim();
const NOTCUE=/^(CONTINUED|CONT['’]?D|MORE|(SMASH |MATCH |JUMP )?CUT TO|FADE (IN|OUT|TO)( BLACK)?|DISSOLVE TO|BACK TO( SCENE)?|INTERCUT|SUPER|TITLE( CARD)?|INSERT|MONTAGE|END (OF )?MONTAGE|SERIES OF SHOTS|THE END|END|LATER|CONTINUOUS|FLASHBACK|END (OF )?FLASHBACK|OMITTED|BLACK|CREDITS?)\b/i;

/* ---- plain text / Fountain ---- */
function parseText(txt){const lines=txt.replace(/\r/g,'').replace(/\t/g,'    ').split('\n');const els=[];let i=0,title='';
  if(/^\s*(title|credit|author|authors|source|draft date|contact)\s*:/i.test(lines[0]||'')){for(;i<lines.length&&lines[i].trim()!=='';i++){const m=lines[i].match(/^\s*title\s*:\s*(.*)/i);if(m)title=m[1].replace(/[_*]/g,'').trim();}}
  const blank=k=>k<0||k>=lines.length||!lines[k].trim();
  for(;i<lines.length;i++){let s=lines[i].trim();if(!s||JUNK.test(s)||/^\d+\.?$/.test(s)&&blank(i-1)&&blank(i+1))continue;const last=els[els.length-1];const pb=blank(i-1),nb=blank(i+1);
    if(s[0]==='.'&&s[1]&&s[1]!=='.'){const m=s.slice(1).match(/^(.*?)\s*(?:#([^#]+)#)?$/);els.push({t:'h',x:m[1].trim(),num:m[2]||''});continue;}
    if(pb){const fm=s.match(/\s*#([^#]+)#\s*$/);const h=headEl(fm?s.slice(0,fm.index):s);if(h){if(fm)h.num=fm[1].trim();els.push(h);continue;}}
    if(s[0]==='>'&&!/<$/.test(s)){els.push({t:'tr',x:s.slice(1).trim()});continue;}
    if(pb&&isUpper(s)&&/(TO:|FADE OUT\.?|FADE IN:|CUT TO BLACK\.?)$/.test(s)&&s.length<32){els.push({t:'tr',x:s});continue;}
    if(s[0]==='@'&&pb&&!nb){els.push({t:'c',x:s.slice(1).trim()});continue;}
    if(pb&&!nb&&isCue(s)){els.push({t:'c',x:s});continue;}
    if(last&&!pb&&(last.t==='c'||last.t==='p'||last.t==='d')){if(/^\(.*\)$/.test(s))els.push({t:'p',x:s});else if(last.t==='d')last.x+=' '+s;else els.push({t:'d',x:s});continue;}
    if(s[0]==='!')s=s.slice(1);
    if(last&&last.t==='a'&&!pb)last.x+=' '+s;else els.push({t:'a',x:s});}
  paginate(els);return {els,title,R:54};}
const WRAP={h:60,a:60,c:38,d:35,p:26,tr:60};
function wrapCount(text,w){let lines=1,len=0;text.split(/\s+/).forEach(wd=>{if(!wd)return;if(!len)len=wd.length;else if(len+1+wd.length<=w)len+=1+wd.length;else{lines++;len=wd.length;}});return lines;}
function paginate(els,R){R=R||54;let abs=0;els.forEach((e,i)=>{const gap=!i?0:e.t==='h'?2:(e.t==='d'||e.t==='p')?0:1;abs+=gap;e.n=wrapCount(e.x,WRAP[e.t]||60);
    const row=abs%R;if((e.t==='h'&&row>=R-2)||(e.t==='c'&&row>=R-1))abs+=R-row;if(abs%R<gap&&i)abs-=abs%R;
    e.pg=Math.floor(abs/R)+1;e.row=abs%R;abs+=e.n;});}

/* ---- Final Draft ---- */
function parseFDX(txt){const doc=new DOMParser().parseFromString(txt,'text/xml');const root=doc.documentElement;if(!root||root.nodeName!=='FinalDraft')throw new Error('That file is not a Final Draft script.');
  const content=[...root.children].find(c=>c.nodeName==='Content');if(!content)throw new Error('That Final Draft file has no script content.');
  const MAP={'Scene Heading':'h','Action':'a','Character':'c','Dialogue':'d','Parenthetical':'p','Transition':'tr','Shot':'a','General':'a','Cast List':null};const els=[];
  content.querySelectorAll('Paragraph').forEach(p=>{const type=p.getAttribute('Type')||'Action';const t=type in MAP?MAP[type]:'a';if(!t)return;const x=[...p.children].filter(c=>c.nodeName==='Text').map(c=>c.textContent).join('').replace(/\s+/g,' ').trim();if(!x)return;
    const e={t,x};if(t==='h'){e.num=p.getAttribute('Number')||'';}els.push(e);});
  let title='';const tp=[...root.children].find(c=>c.nodeName==='TitlePage');if(tp){const first=[...tp.querySelectorAll('Paragraph')].map(p=>p.textContent.replace(/\s+/g,' ').trim()).find(Boolean);if(first)title=first;}
  paginate(els);return {els,title,R:54};}

/* ---- PDF ---- */
async function parsePDF(buf,onProgress){
  if(!window.pdfjsLib)throw new Error('The PDF reader did not load. Check your connection and reload the page.');
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;const pages=[];let textItems=0;
  for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p);const vp=page.getViewport({scale:1});const tc=await page.getTextContent();
    const items=tc.items.filter(it=>it.str&&it.str.trim()).map(it=>({s:it.str,x:it.transform[4],y:it.transform[5],w:it.width||0,h:it.height||Math.abs(it.transform[3])||12}));textItems+=items.length;
    items.sort((a,b)=>b.y-a.y||a.x-b.x);const lines=[];items.forEach(it=>{const ln=lines[lines.length-1];if(ln&&Math.abs(ln.y-it.y)<3)ln.items.push(it);else lines.push({y:it.y,items:[it]});});
    lines.forEach(ln=>ln.items.sort((a,b)=>a.x-b.x));pages.push({H:vp.height,lines});if(onProgress)onProgress(p,pdf.numPages);}
  if(textItems<20)throw new Error('This PDF has no readable text. It is probably a scan (page images). Export a text-based PDF from the screenwriting app, or import the .fdx or Fountain file instead.');
  // left margin of action lines
  const hist={};let total=0;pages.forEach(pg=>pg.lines.forEach(ln=>{const f=ln.items[0];if(/^\d+[A-Z]?\.?$/.test(f.s.trim())||/^\*+$/.test(f.s.trim()))return;const k=Math.round(f.x/2)*2;hist[k]=(hist[k]||0)+1;total++;}));
  const need=Math.max(3,total*.03);let L=1e9;Object.keys(hist).forEach(k=>{k=+k;const c=hist[k]+(hist[k-2]||0)+(hist[k+2]||0);if(c>=need&&k>=36&&k<L)L=k;});if(L===1e9)L=108;
  // line pitch
  const diffs=[];pages.forEach(pg=>{for(let i=1;i<pg.lines.length;i++){const d=pg.lines[i-1].y-pg.lines[i].y;if(d>8&&d<16)diffs.push(d);}});diffs.sort((a,b)=>a-b);const LH=diffs.length?diffs[diffs.length>>1]:12;
  // build lines
  const out=[];pages.forEach((pg,pi)=>{const pl=[];pg.lines.forEach(ln=>{if(ln.y>pg.H-58||ln.y<34)return;let s='',prev=null,lx=null;
      ln.items.forEach(it=>{if(prev){const gap=it.x-(prev.x+prev.w);if(gap>it.h*.22&&!/\s$/.test(s)&&!/^\s/.test(it.s))s+=gap>it.h*2.4?'   ':' ';}s+=it.s;prev=it;if(lx===null&&it.x>=L-10&&!/^\*+$/.test(it.s.trim()))lx=it.x;});
      s=s.replace(/\s+\*+\s*$/,'').replace(/^\*+\s+/,'');const raw=s;s=s.replace(/\s+/g,' ').trim();if(!s||JUNK.test(s))return;if(lx===null)lx=ln.items[0].x;pl.push({s,raw,x:lx,y:ln.y});});
    out.push(pl);});
  // skip front matter (title pages)
  let first=0;for(let i=0;i<Math.min(out.length,4);i++){if(out[i].some(l=>HEAD.test(l.s)||/^FADE IN/.test(l.s))){first=i;break;}}
  let title='';if(first>0&&out[0].length)title=out[0][0].s;
  const tops=out.slice(first).filter(pl=>pl.length>8).map(pl=>pl[0].y).sort((a,b)=>a-b);const TOP=tops.length?tops[Math.min(tops.length-1,Math.floor(tops.length*.9))]:(pages[0].H-72);
  const els=[];let maxRows=[];
  out.slice(first).forEach((pl,pi)=>{let prevT=null,prevRow=-9,mr=0;pl.forEach(ln=>{const row=Math.max(0,Math.round((TOP-ln.y)/LH));mr=Math.max(mr,row);const dx=ln.x-L;const s=ln.s;let t,num='';let x=s;const last=els[els.length-1];const adj=last&&last.pg===pi+1&&row-prevRow===1;
      const h=dx<60&&(dx<24||isUpper(s))?headEl(s,ln.raw):null;
      if(h){t='h';x=h.x;num=h.num;}
      else if(dx<24){t=isUpper(s)&&/(TO:|FADE OUT\.?|FADE IN:|CUT TO BLACK\.?)$/.test(s)&&s.length<32?'tr':'a';}
      else if(/^\(/.test(s)&&dx<210&&dx>30)t='p';
      else if(adj&&prevT==='p'&&!/\)\s*$/.test(last.x)&&dx>30)t='p';
      else if(dx>=225||(isUpper(s)&&/TO:$/.test(s)&&dx>150))t='tr';
      else if(dx>=115&&isCue(s))t='c';
      else if(dx>=36)t='d';
      else t='a';
      if(adj&&t===prevT&&(t==='a'||t==='d'||t==='p')){last.x+=' '+x;last.n++;}
      else els.push({t,x,pg:pi+1,row,n:1,num});
      prevT=t;prevRow=row;});maxRows.push(mr+1);});
  maxRows=maxRows.filter(m=>m>30).sort((a,b)=>a-b);const R=Math.min(64,Math.max(54,maxRows.length?maxRows[Math.floor(maxRows.length*.9)]:54));
  return {els,title,R,pages:out.length-first};}
/* ============================================================
   Script Desk — model
   ============================================================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const BASE_CATS=[['cast','Cast','#d92d20'],['extras','Background','#2f9e44'],['stunts','Stunts','#f08c00'],['props','Props','#7048e8'],['wardrobe','Wardrobe','#0c8599'],['makeup','Makeup & hair','#c2255c'],['setdress','Set dressing','#8a6d3b'],['vehicles','Vehicles','#e64980'],['animals','Animals','#5c940d'],['sfx','Special effects','#1971c2'],['vfx','Visual effects','#12b886'],['sound','Sound & music','#a0522d'],['equip','Special equipment','#495057'],['misc','Production notes','#868e96']];
let CATS=BASE_CATS.map(c=>c.slice()),CAT={};
function applyCats(list){CATS=(list&&list.length?list:BASE_CATS).map(c=>c.slice());const used=new Set();if(S){S.an.forEach(a=>{if(a.k==='tag')used.add(a.cat);});Object.values(S.sc).forEach(st=>(st.els||[]).forEach(x=>used.add(x.cat)));}
  used.forEach(id=>{if(!CATS.some(c=>c[0]===id)){const b=BASE_CATS.find(c=>c[0]===id);CATS.push(b?b.slice():[id,'Other','#868e96']);}});if(!CATS.some(c=>c[0]==='cast'))CATS.unshift(BASE_CATS[0].slice());
  CAT=Object.fromEntries(CATS.map(c=>[c[0],{id:c[0],name:c[1],color:c[2]}]));}
const CAT_COLORS=['#e8590c','#2b8a3e','#1864ab','#862e9c','#a61e4d','#5f3dc4','#087f5b','#e67700','#364fc7','#c92a2a'];

let undoStack=[];
function pushUndo(){undoStack.push(JSON.stringify({an:S.an,sc:S.sc,splits:S.splits,unhead:S.unhead,gn:S.gn,beats:S.beats,setups:S.setups,lost:S.lost,alias:S.alias,notCast:S.notCast,locNeeds:S.locNeeds,bdEdit:S.bdEdit}));if(undoStack.length>60)undoStack.shift();$('#bUndo').disabled=false;}
function undo(){if(!undoStack.length)return;const o=JSON.parse(undoStack.pop());S.an=o.an;S.sc=o.sc;S.splits=o.splits||{};S.unhead=o.unhead||{};S.gn=o.gn||[];S.beats=o.beats||[];S.setups=o.setups||[];S.lost=o.lost||[];S.alias=o.alias||{};S.notCast=o.notCast||{};S.locNeeds=o.locNeeds||{};S.bdEdit=o.bdEdit||S.bdEdit||{};$('#bUndo').disabled=!undoStack.length;hideDock();renderAll(true);scheduleSave();}
$('#bUndo').onclick=undo;

function openHelp(){openModal(`<h3>How it works</h3><div style="line-height:1.6">
 <p><b>Lighting Plot.</b> <b>More → Send to the Lighting Plot</b> packs scenes, their sides and your camera setups into one file. Import it from the plot’s Shot list and each camera setup arrives as a shot linked to its lines, ready for you to place the camera and lights.</p>
 <p><b>For the editor.</b> Open a setup to log its takes, circle the ones to print and add continuity notes. Select words and choose <b>Cut on the day</b> to strike lines that were dropped. <b>More → Editor’s package</b> then downloads the lined script with facing pages, a takes log and a list of shoot-day changes.</p>
 <p><b>New drafts.</b> <b>More → Import a new draft</b> compares a revised script with the one that is open and moves your highlights, notes, tags, camera setups and scene details onto the matching lines. Notes on rewritten lines are flagged for review, notes on cut lines are kept in a list, and the earlier draft stays in My scripts.</p>
 <p><b>Line the script.</b> Highlight exactly what one camera setup covers and choose <b>Line as a camera setup</b>. A labeled line runs down the script from the first word you highlighted to the last. The Scene tab lists each scene’s camera setups and tells you what has no coverage yet.</p>
 <p><b>Make sides.</b> <b>More → Make sides</b> lets you tick the scenes for a shoot day and download a PDF of just those pages, with the other scenes crossed out. Days are saved so you can come back to them.</p>
 <p><b>Import.</b> Bring in a PDF, a Final Draft file (.fdx), a Fountain file, or pasted text. Scenes are found from their INT./EXT. headings and each one is measured in eighths of a page.</p>
 <p><b>Mark up.</b> Select any words in the script. A bar appears with highlight colors, <b>Add note</b>, and the breakdown categories. Click a marked passage to edit or remove it.</p>
 <p><b>Tag elements.</b> Tagging a word adds that element to the scene’s breakdown sheet. After the first tag you can review every other place the same word appears and tick only the ones that mean the same thing. Each tag can also be renamed, moved to another category or removed on its own. Characters who speak are listed as cast automatically.</p>
 <p><b>Break down.</b> The <b>Scene</b> tab is the breakdown sheet for the scene you are reading: length, synopsis and elements. The <b>Breakdown</b> view lists every scene, location and element, and exports to CSV.</p>
 <p><b>Give notes.</b> Each note has a type (story, character, pacing…) and sits on a layer. Add notes on a whole scene from the Scene tab, and on the whole script from the Notes tab. <b>Notes summary</b> compiles everything by page, scene or type, ready to copy or download.</p>

 <p><b>Eighths.</b> Lengths are measured from where each scene starts and ends on the page. If your count differs, type your own length on the Scene tab; the totals follow.</p></div>
 <div class="mFoot"><button class="btn pri" data-close>Got it</button></div>`);}

async function listScripts(){const out={};const idx=LS.get('sdesk.index')||{};Object.entries(idx).forEach(([id,v])=>out[id]={id,title:v.title,updated:v.updated,where:'this browser'});

function collectNotes(incHl){const out=[];S.an.forEach(a=>{if(a.k==='tag'||a.k==='cut'||!vis(a))return;if(a.k==='hl'&&!incHl)return;out.push({i:a.s[0],o:a.s[1],pg:S.els[a.s[0]].pg,sc:annoScene(a),ty:a.k==='note'?tyOf(a):null,q:a.q,x:a.k==='note'?a.x:'',hl:a.k==='hl'?HLN[a.c]:null});});
  S.gn.forEach(n=>{if(S.lyHidden[lyOf(n)]||!n.x.trim())return;if(n.scope==='scene'){const sc=SC.find(s=>s.key===n.key);if(sc)out.push({i:sc.i,o:-1,pg:sc.pg,sc,ty:tyOf(n),x:n.x,q:'',scene:true});}else out.push({i:-1,o:0,pg:0,sc:null,ty:tyOf(n),x:n.x,q:'',script:true});});
  return out.sort((a,b)=>a.i-b.i||a.o-b.o);}
function summaryBlocks(o){const items=collectNotes(o.hl);const B=[{t:'h1',x:`${S.title}: notes`},{t:'p',x:`${new Date().toLocaleDateString()} · ${LY.filter(l=>!S.lyHidden[l[0]]).map(l=>l[1]).join(', ')||'no layers shown'}`}];
  const line=(n,noTy)=>({t:'li',where:n.script?'':`p.${n.pg}${n.sc?', Sc '+n.sc.num:''}${n.scene?' (scene note)':''}`,ty:noTy?'':(n.ty?NTM[n.ty].name:n.hl+' highlight'),q:n.q,x:n.x||(n.hl?'':'(empty note)')});
  if(!items.length){B.push({t:'p',x:'No notes yet.'});return B;}
  if(o.order==='type'){NT.forEach(([id,name])=>{const g=items.filter(n=>n.ty===id);if(g.length){B.push({t:'h2',x:name});g.forEach(n=>B.push(line(n,true)));}});const hl=items.filter(n=>n.hl);if(hl.length){B.push({t:'h2',x:'Highlights'});hl.forEach(n=>B.push(line(n)));}return B;}
  const overall=items.filter(n=>n.script),rest=items.filter(n=>!n.script);if(overall.length){B.push({t:'h2',x:'Overall'});overall.forEach(n=>B.push(line(n)));}
  if(o.order==='scene'){let lastKey=null;rest.forEach(n=>{const key=n.sc?n.sc.key:'front';if(key!==lastKey){lastKey=key;B.push({t:'h2',x:n.sc?`Scene ${n.sc.num}: ${n.sc.slug}`:'Before the first scene'});}B.push(line(n));});}
  else if(rest.length){B.push({t:'h2',x:'Page by page'});rest.forEach(n=>B.push(line(n)));}
  return B;}
function blocksText(B){return B.map(b=>b.t==='h1'?b.x+'\n'+'='.repeat(Math.min(60,b.x.length)):b.t==='h2'?'\n'+b.x.toUpperCase():b.t==='p'?b.x:`• ${b.where?b.where+' — ':''}${b.ty?'['+b.ty+'] ':''}${b.q?'“'+b.q+'”':''}${b.x?(b.q?'\n    ':'')+b.x.replace(/\n/g,'\n    '):''}`).join('\n');}
function blocksHTML(B){const LA="font-family:Lato,'Lato Regular',Calibri,Arial,sans-serif",GA="font-family:'EB Garamond',Garamond,Georgia,serif",CO="font-family:'Courier New',Courier,monospace";return `<html><head><meta charset="utf-8"><title>${esc(S.title)} notes</title></head><body style="${LA};font-size:11pt"><p style="${GA};font-style:italic;font-size:13pt;color:#bd5103;margin:0 0 6pt">Clementine Films</p>`+B.map(b=>b.t==='h1'?`<h1 style="${GA};font-weight:600;font-size:22pt;margin:0 0 4pt">${esc(b.x)}</h1>`:b.t==='h2'?`<h2 style="${GA};font-weight:600;font-size:15pt;margin-top:18pt">${esc(b.x)}</h2>`:b.t==='p'?`<p style="${LA};color:#666">${esc(b.x)}</p>`:`<p style="${LA};margin:0 0 8pt 0">${b.where?`<b>${esc(b.where)}</b> `:''}${b.ty?`<span style="color:#555">[${esc(b.ty)}]</span> `:''}${b.q?`<span style="${CO};font-size:10.5pt">${esc(b.q)}</span>`:''}${b.x?(b.q?'<br>':'')+esc(b.x).replace(/\n/g,'<br>'):''}</p>`).join('')+'</body></html>';}

const STATUS=[['','Not scheduled'],['sched','Scheduled'],['part','Partly shot'],['shot','Shot']];
const LINE_COLS=['#c2410c','#1d4ed8','#15803d','#9333ea','#be123c','#0e7490','#a16207','#4338ca'];
const SIZES=['WS','MS','MCU','CU','OTS','2-shot','Insert','POV'];
const stOf=s=>(S.sc[s.key]||{}).status||'';
const absRow=e=>(e.pg-1)*(S.R||54)+e.row;
function suO0(u){const e=S.els[u.e0];return e?Math.max(0,Math.min(u.o0||0,e.x.length)):0;}
function suO1(u){const e=S.els[u.e1];if(!e)return 0;return u.o1==null?e.x.length:Math.max(0,Math.min(u.o1,e.x.length));}
function setupE8(u){const E=S.els;const a=E[u.e0],b=E[u.e1];if(!a||!b)return 0;const fa=a.x.length?suO0(u)/a.x.length:0,fb=b.x.length?suO1(u)/b.x.length:1;return Math.max(1,Math.round((absRow(b)+b.n*fb-absRow(a)-a.n*fa)*8/(S.R||54)));}
function elPoint(i,off,end){const host=elNode[i];if(!host)return null;const w=document.createTreeWalker(host,NodeFilter.SHOW_TEXT);let n,acc=0;while((n=w.nextNode())){const L=n.nodeValue.length;if(end?(off>acc&&off<=acc+L):(off>=acc&&off<acc+L)){const r=document.createRange();const o=off-acc;try{if(end){r.setStart(n,o-1);r.setEnd(n,o);}else{r.setStart(n,o);r.setEnd(n,o+1);}}catch(e){return null;}const rc=r.getClientRects();const q=rc.length?rc[end?rc.length-1:0]:null;const hb=host.getBoundingClientRect();if(!q||!q.height)return null;return {top:host.offsetTop+q.top-hb.top,bot:host.offsetTop+q.bottom-hb.top};}acc+=L;}return null;}
function setupsIn(k){return S.setups.filter(u=>elSc[u.e0]===k).sort((a,b)=>a.e0-b.e0||a.e1-b.e1);}
function uncovered(k){const s=SC[k];if(!s)return [];const out=[];for(let i=s.i;i<=s.end;i++){const t=S.els[i].t;if(t!=='a'&&t!=='d')continue;if(!S.setups.some(u=>u.e0<=i&&u.e1>=i))out.push(i);}return out;}
function nextSetupLabel(k){const s=SC[k];const n=setupsIn(k).length;const used=new Set(S.setups.map(u=>u.label.toLowerCase()));const mk=j=>/[A-Za-z]$/.test(s.num)?s.num+'-'+(j+1):s.num+(j<26?String.fromCharCode(65+j):'Z'+(j-25));let j=n;while(used.has(mk(j).toLowerCase()))j++;return mk(j);}
function snipAt(i,o,end){const x=S.els[i].x;if(end){const t=o==null?x:x.slice(0,o);return t.length>46?'…'+t.slice(-44):t;}const t=x.slice(o||0);return ((o||0)>0?'…':'')+(t.length>46?t.slice(0,44)+'…':t);}
function snip(i,fromEnd){const x=S.els[i].x;return fromEnd?(x.length>46?'…'+x.slice(-44):x):(x.length>46?x.slice(0,44)+'…':x);}

/* ---- coverage lines drawn through the script ---- */
function renderLines(){const pg=$('#page');if(!pg||!S)return;let host=document.getElementById('lines');if(!host){host=document.createElement('div');host.id='lines';pg.appendChild(host);}
  if(!S.setups.length||S.linesHidden){host.innerHTML='';return;}
  const fs=parseFloat(getComputedStyle(pg).fontSize)||15,tagH=fs*.68*1.55+3;const tagR=(parseFloat(getComputedStyle(host).getPropertyValue('--tagR'))||3.4)*fs;
  // measure every setup, then pack them into as few lanes as possible (a lane is reused once the line above it has ended)
  const L=[];S.setups.forEach(u=>{const n0=elNode[u.e0],n1=elNode[u.e1];if(!n0||!n1)return;const p0=suO0(u)>0?elPoint(u.e0,suO0(u),false):null,p1=u.o1!=null&&suO1(u)<S.els[u.e1].x.length?elPoint(u.e1,suO1(u),true):null;
    const top=p0?p0.top-1:n0.offsetTop,bot=p1?p1.bot+1:n1.offsetTop+n1.offsetHeight;L.push({u,top,bot});});
  L.sort((a,b)=>a.top-b.top||b.bot-a.bot);const ends=[];
  L.forEach(o=>{let lane=ends.findIndex(e=>e<o.top-2);if(lane<0){lane=ends.length;ends.push(0);}ends[lane]=o.bot;o.lane=lane;});
  // tags sit in the left margin, stacked so they never overlap; a faint rule leads to the line they belong to
  let last=-1e9,h='';
  L.forEach((o,i)=>{const u=o.u;const col=LINE_COLS[i%LINE_COLS.length];let ty=Math.max(o.top,last+3);last=ty+tagH;const cy=Math.min(Math.max(ty+tagH/2,o.top+2),o.bot-2);
    h+=`<div class="ln ${u.shot?'shot':''}" style="top:${o.top}px;height:${Math.max(8,o.bot-o.top)}px;left:calc(var(--lx) + ${o.lane*1.5}em);--lc:${col}"><i></i></div>`
     +`<div class="lnLead" style="top:${cy}px;width:calc(var(--lx) + ${o.lane*1.5}em - var(--tagR));--lc:${col}"></div>`
     +`<button class="lnTag" data-su="${u.id}" style="top:${ty}px;right:calc(100% - ${tagR}px);--lc:${col}" title="${esc(u.label+(u.desc?' · '+u.desc:''))}">${esc(u.label)}${u.shot?' ✓':''}</button>`;});
  host.innerHTML=h;}
let lineRO=0;if(window.ResizeObserver)new ResizeObserver(()=>{cancelAnimationFrame(lineRO);lineRO=requestAnimationFrame(renderLines);}).observe($('#page'));
$('#page').addEventListener('click',e=>{const t=e.target.closest('.lnTag');if(!t)return;e.stopPropagation();const u=S.setups.find(x=>x.id===t.dataset.su);if(u)setupDialog(u);},true);
function setupDialog(u,range){const isNew=!u;if(isNew){const k=elSc[range.e0];if(k<0){toast('That text comes before the first scene heading');return;}u={id:'u'+uid(),label:nextSetupLabel(k),desc:'',e0:range.e0,e1:range.e1,o0:range.o0||0,o1:range.o1==null?null:range.o1,shot:false};}
  let e0=u.e0,e1=u.e1,o0=u.o0||0,o1=u.o1==null?null:u.o1,lab=u.label,desc=u.desc,shot=!!u.shot,cont=u.cont||'',takes=(u.takes||[]).map(t=>Object.assign({},t));const k=elSc[e0];const s=SC[k];
  const grab=()=>{lab=$('#suLabel').value;desc=$('#suDesc').value;shot=$('#suShot').checked;cont=$('#suCont').value;document.querySelectorAll('#suTakes .tkRow').forEach((r,i)=>{if(takes[i]){takes[i].c=r.querySelector('[data-tc]').checked;takes[i].x=r.querySelector('[data-tx]').value;}});};
  const draw=()=>{openModal(`<h3>${isNew?'New camera setup':'Camera setup '+esc(u.label)}</h3><div class="pSub">One camera position, covering exactly what you highlighted. It becomes a shot in the Lighting Plot, where you place the camera and lights.</div>
    <div style="display:grid;grid-template-columns:110px 1fr;gap:10px"><div class="f" style="margin:0"><label for="suLabel">Camera setup</label><input class="in" id="suLabel" value="${esc(lab)}" maxlength="12" style="font-family:var(--mono)"></div><div class="f" style="margin:0"><label for="suDesc">Shot description</label><input class="in" id="suDesc" value="${esc(desc)}" placeholder="WS master, favoring Nora"></div></div>
    <div class="chips" style="margin:8px 0 2px;flex-wrap:wrap">${SIZES.map(z=>`<button class="chip" data-sz="${z}">${z}</button>`).join('')}</div>
    <div class="f"><label>Covers ${fmt8(setupE8({e0,e1,o0,o1}))} of a page in scene ${esc(s?s.num:'')}</label><div class="covBox"><div><span>From</span>${esc(snipAt(e0,o0,false))}</div><div><span>To</span>${esc(snipAt(e1,o1,true))}</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><button class="btn sm" id="suTop" ${s&&e0===s.i&&!o0?'disabled':''}>Start at the top of the scene</button><button class="btn sm" id="suEnd" ${s&&e1===s.end&&o1==null?'disabled':''}>Run to the end of the scene</button></div></div>
    <div class="f"><label>Takes${takes.length?` · ${takes.filter(t=>t.c).length} circled of ${takes.length}`:''}</label><div id="suTakes">${takes.map((t,i)=>`<div class="tkRow"><b>T${t.n}</b><label class="chk" style="margin:0" title="Circle the takes to print"><input type="checkbox" data-tc="${i}" ${t.c?'checked':''}>Circle</label><input class="in" data-tx="${i}" value="${esc(t.x||'')}" placeholder="Note for the editor" aria-label="Note for take ${t.n}"><button class="btn sm danger" data-trm="${i}" aria-label="Remove take ${t.n}">×</button></div>`).join('')}</div><button class="btn sm" id="suAddTake">Add take ${takes.length?takes[takes.length-1].n+1:1}</button></div>

    <label class="chk"><input type="checkbox" id="suShot" ${shot?'checked':''}> This camera setup has been filmed</label>
    <div class="mFoot">${isNew?'':'<button class="btn danger" id="suDel">Remove</button>'}<button class="btn" data-close>Cancel</button><button class="btn pri" id="suSave">${isNew?'Add camera setup':'Save'}</button></div>`);
    $('#modalBox').onclick=ev=>{const z=ev.target.closest('[data-sz]');if(z){const f=$('#suDesc');const v=f.value.trim();f.value=SIZES.some(q=>v.startsWith(q+' ')||v===q)?v.replace(/^\S+/,z.dataset.sz):(z.dataset.sz+(v?' '+v:''));f.focus();return;}

function doodData(cats){const days=(S.days||[]).filter(d=>(d.keys||[]).length);const CN=castNumbers();const rows=[];

    let list=[...m.values()];if(c==='cast')list.sort((a,b)=>(CN.num.get(keyOf(a.name))||999)-(CN.num.get(keyOf(b.name))||999));else list.sort((a,b)=>a.name.localeCompare(b.name));
    list.forEach(v=>{const w=[...v.work].sort((a,b)=>a-b);const f=w[0],l=w[w.length-1];const cells=days.map((d,i)=>{if(v.work.has(i))return w.length===1?'SWF':i===f?'SW':i===l?'WF':'W';return i>f&&i<l?'H':'';});

  return {days,rows};}

    const mb=$('#modalBox');mb.innerHTML=`<h3>Review breakdown sheets</h3><div class="pSub">Change anything for these sheets: reword, delete or add lines (one item per line). Edits are kept for next time and never change your tags or the script. <b>Reset</b> puts a scene back to what’s tagged.</div>
      <div class="bdRev"><div class="bdList">${scenes.map((x,i)=>`<button class="bdItem ${i===k?'on':''}" data-bi="${i}"><b>${esc(x.num)}</b> <span>${esc(x.set)}</span>${S.bdEdit[x.key]?'<i title="Edited">edited</i>':''}</button>`).join('')}</div>
      <div class="bdForm"><div class="bdSlug" style="background:${stripColor(s.ie,todFor(s))}"><b>Scene ${esc(s.num)}</b> ${esc([s.ie,s.set].filter(Boolean).join('. ')+(s.tod?' - '+s.tod:''))} <span>${fmt8(s.e8)} pgs</span></div>
        <div class="f"><label>Synopsis</label><textarea class="in" rows="2" data-bf="syn">${esc(D.syn)}</textarea></div>
        <div class="bdGrid">${D.blocks.map((b,i)=>`<div class="f bdBlk"><label><i style="background:${b.color||'#868e96'}"></i>${esc(b.n)} <button class="x" data-brm="${i}" title="Remove this section from the sheet" aria-label="Remove ${esc(b.n)}">×</button></label><textarea class="in" rows="${Math.max(2,Math.min(8,b.items.length+1))}" data-bb="${i}" placeholder="One item per line">${esc(lines(b.items))}</textarea></div>`).join('')}</div>
        ${addable.length?`<div style="display:flex;gap:6px;align-items:center;margin:4px 0 10px"><select class="in" id="bdAdd" style="width:auto"><option value="">+ Add a category…</option>${addable.map(([c,n])=>`<option value="${c}">${esc(n)}</option>`).join('')}</select></div>`:''}
        ${D.risk.length||auto.risk.length?`<div class="f"><label>Special scene / hazardous activity</label><textarea class="in" rows="3" data-bf="risk">${esc(lines(D.risk))}</textarea></div>`:''}
        <div class="f"><label>Scene notes</label><textarea class="in" rows="3" data-bf="notes" placeholder="One note per line">${esc(lines(D.notes))}</textarea></div>
        <div style="display:flex;gap:6px;justify-content:space-between;align-items:center"><button class="btn sm" id="bdReset" ${S.bdEdit[s.key]?'':'disabled'}>Reset this scene to tags</button><span class="pSub" style="margin:0">Scene ${k+1} of ${scenes.length}</span><div style="display:flex;gap:6px"><button class="btn sm" id="bdPrev" ${k?'':'disabled'}>‹ Prev</button><button class="btn sm" id="bdNext" ${k<scenes.length-1?'':'disabled'}>Next ›</button></div></div></div></div>
      <div class="mFoot"><button class="btn" data-close>Cancel</button><button class="btn pri" id="bdDl">Download PDF</button></div>`;};
  // read the form into this scene's saved edit
  const save=()=>{const s=cur(),D=data();const mb=$('#modalBox');const blocks=D.blocks.map((b,i)=>{const t=mb.querySelector(`[data-bb="${i}"]`);return Object.assign({},b,{items:t?split(t.value):b.items});});
    const g=f=>{const t=mb.querySelector(`[data-bf="${f}"]`);return t?t.value:null;};const e={syn:(g('syn')||'').trim(),blocks,risk:g('risk')!=null?split(g('risk')):D.risk,notes:split(g('notes')||'')};
    const a=bdAuto(s,opt,CN);const same=JSON.stringify({syn:a.syn,blocks:a.blocks.map(b=>[b.n,b.items]),risk:a.risk,notes:a.notes})===JSON.stringify({syn:e.syn,blocks:e.blocks.map(b=>[b.n,b.items]),risk:e.risk,notes:e.notes});
    if(same)delete S.bdEdit[s.key];else S.bdEdit[s.key]=e;scheduleSave();};
  openModal('',true);$('#modalBox').style.width='min(980px,100%)';draw();const mb=$('#modalBox');
  mb.onclick=async e=>{const t=e.target;const bi=t.closest('[data-bi]');if(bi){save();k=+bi.dataset.bi;draw();return;}
    if(t.id==='bdPrev'){save();k--;draw();return;}if(t.id==='bdNext'){save();k++;draw();return;}
    if(t.id==='bdReset'){pushUndo();delete S.bdEdit[cur().key];scheduleSave();draw();return;}
    const rm=t.closest('[data-brm]');if(rm){save();const e2=S.bdEdit[cur().key]||JSON.parse(JSON.stringify(Object.assign({},bdAuto(cur(),opt,CN))));e2.blocks=(e2.blocks||[]).filter((b,i)=>i!==+rm.dataset.brm);S.bdEdit[cur().key]=e2;scheduleSave();draw();return;}
    if(t.id==='bdDl'){save();if(!(await needPDF()))return;saveFile(`${slug(S.title)}-breakdown-sheets.pdf`,breakdownPDF(opt));closeModal();}};
  mb.onchange=e=>{if(e.target.id==='bdAdd'&&e.target.value){save();const c=e.target.value;const e2=S.bdEdit[cur().key]||JSON.parse(JSON.stringify(bdAuto(cur(),opt,CN)));e2.blocks=e2.blocks||[];e2.blocks.push({n:CAT[c].name,items:[],color:CAT[c].color,c});S.bdEdit[cur().key]=e2;scheduleSave();draw();setTimeout(()=>{const ts=mb.querySelectorAll('[data-bb]');ts[ts.length-1]&&ts[ts.length-1].focus();},30);}};}

const SAMPLE=`Title: The Last Ferry (sample)

FADE IN:

EXT. HARBOR - FERRY DOCK - DUSK

Gulls wheel over a rusted ferry. NORA VALE (30s), rain jacket zipped to her chin, drags a battered suitcase down the ramp. A DOCKHAND coils rope and watches her come.

DOCKHAND
Last boat's in ten minutes.

NORA
Then I've got nine to change my mind.

She pulls a creased envelope from her pocket, looks at the address, and puts it away again.

INT. FERRY - PASSENGER CABIN - CONTINUOUS

Rows of orange plastic seats. A vending machine hums. Nora takes a window seat and sets the suitcase on her knees.

Across the aisle, ELI (10) lines up toy cars on the armrest. His GRANDMOTHER dozes beside him under a wool blanket.

ELI
Is that a real suitcase?

NORA
As opposed to what?

ELI
(shrugging)
A spy one.

Nora almost smiles. She flips the latches. Inside: a brass ship's compass wrapped in a scarf, a stack of letters tied with string, and a child's yellow raincoat.

ELI (CONT'D)
That's not spy stuff.

NORA
No. It's worse.

EXT. FERRY - UPPER DECK - NIGHT

Wind and spray. Nora grips the rail with one hand, the compass in the other. The needle swings and settles. The lights of the island slide into view.

CAPTAIN MARSH (60s) steps out of the wheelhouse with two paper cups of coffee.

CAPTAIN MARSH
You're Tom Vale's girl.

NORA
I was.

He hands her a cup. They watch the island come on.

CAPTAIN MARSH
He kept your room. Thought you should know before you see it.

A foghorn sounds. Nora closes the compass with a click.

INT. VALE HOUSE - HALLWAY - NIGHT

Dark. A key turns. Nora steps in, dripping, and finds the light switch. A long hallway lined with framed nautical charts. A grey cat blinks at her from the stairs.

She sets down the suitcase, takes out the yellow raincoat, and hangs it on the lowest hook by the door. It still fits the hook.

NORA
(quietly)
Okay. I'm here.

The cat jumps down and follows her into the dark.

CUT TO:

EXT. VALE HOUSE - PORCH - DAWN

Grey light. Nora sits on the top step with the stack of letters, the string undone. She reads. The Dockhand's truck rattles past on the harbor road and gives one short honk.

She lifts a hand without looking up.

FADE OUT.
`;
function loadSample(){const r=parseText(SAMPLE);setScript({v:1,id:'sample',title:r.title||'Sample script',updated:0,R:54,els:r.els,sc:{},an:[],chunks:0,sample:true},false);setSave('ok','Sample script. Import your own to begin.');}
