:root{
  --bg:#e9ecef;--panel:#f7f8fa;--panel2:#eef0f3;--line:#d5d9df;--ink:#1c2128;--sub:#5b6470;--dim:#8a929c;

  --good:#1a7f43;--warn:#b45309;--bad:#c62828;--note:#c2410c;

}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{display:grid;grid-template-columns:var(--nw,248px) 1fr var(--sw,330px);grid-template-rows:46px 1fr;height:100%;position:relative}
body.noNav #app{--nw:0px}body.noSide #app{--sw:0px}
body.noNav #nav,body.noSide #side{display:none}
body.narrow #app{--nw:0px;--sw:0px}
body.narrow #nav,body.narrow #side{position:absolute;top:46px;bottom:0;z-index:30;width:min(330px,90vw);box-shadow:var(--shadow)}
body.narrow #nav{left:0}body.narrow #side{right:0}
#top{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}

#brand{display:flex;align-items:baseline;gap:7px;white-space:nowrap;flex:none}
.cf{font:italic 400 18px/1 'EB Garamond',Garamond,Georgia,serif;color:var(--brand)}
#brand span{font:600 9.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--sub)}
.cf{flex:none}.cf.cfS{display:none}
@media (max-width:520px){.cf.cfF{display:none}.cf.cfS{display:inline}#top{gap:6px}#top .seg{flex:none}#top .seg button{padding:6px 6px;font-size:12.5px}#title{min-width:0}#top .btn{padding-left:8px;padding-right:8px}}
@media (max-width:379px){.cf.cfS{display:none}}
#title{flex:0 1 240px;min-width:60px;background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 7px;font-weight:600;font-size:14px}
#title:hover,#title:focus{border-color:var(--line);background:var(--paper)}
#stats{font:12px var(--mono);color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 0;min-width:0}
#save{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sub);white-space:nowrap}
#save i{width:7px;height:7px;border-radius:50%;background:var(--good)}
#save.busy i{background:var(--warn)}#save.warn i{background:var(--bad)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:6px 11px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentInk);font-weight:600}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:6px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.ib{border:1px solid transparent;background:transparent;border-radius:7px;padding:6px 8px;line-height:0;color:var(--sub)}
.ib:hover,.ib.on{background:var(--panel2);color:var(--ink)}
.ib.on{border-color:var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:6px 11px;font-weight:500}
.seg button.on{background:var(--accentSoft);color:var(--accent);font-weight:600}
.menuWrap{position:relative}
.menu{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:240px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:5px;z-index:50}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:6px;padding:8px 10px}
.menu button:hover{background:var(--panel2)}
.menu small{display:block;color:var(--sub);font-size:11.5px}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
#nav,#side{background:var(--panel);overflow:hidden;display:flex;flex-direction:column;min-height:0}
#nav{border-right:1px solid var(--line)}#side{border-left:1px solid var(--line)}
#nav{grid-column:1;grid-row:2}#main{grid-column:2;grid-row:2}#side{grid-column:3;grid-row:2}
.secHead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);font-weight:600}
#navQ{margin:0 10px 8px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--paper)}
#sceneList{overflow:auto;flex:1;padding:0 6px 10px}
.sRow{display:grid;grid-template-columns:34px 1fr auto;gap:6px;align-items:baseline;padding:6px 6px;border-radius:6px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
.sRow:hover{background:var(--panel2)}
.sRow.cur{background:var(--accentSoft)}
.sRow .n{font:600 12px var(--mono);color:var(--accent)}
.sRow .s{font-size:12px;line-height:1.3;overflow-wrap:anywhere}
.sRow .s small{display:block;color:var(--sub);font-size:11px}
.sRow .e{font:11.5px var(--mono);color:var(--sub);white-space:nowrap}
#main{position:relative;min-width:0;min-height:0;overflow:hidden}
#scriptWrap,#reportWrap{position:absolute;inset:0;overflow:auto;container-type:inline-size}
#scriptWrap{padding:18px 12px 150px}
body.narrow #scriptWrap{padding:8px 6px 170px}
#page{font-size:15px;font-size:calc(clamp(8px,(100cqw - 2px)/44.2,16.5px)*var(--z,1));font-family:var(--script);line-height:1.2;background:var(--paper);color:var(--paperInk);width:44em;margin:0 auto;padding:3.4em 4.4em 5em 3.6em;border-radius:3px;box-shadow:var(--shadow);position:relative;-webkit-user-select:text;user-select:text}
.el{width:36em;margin-top:1.2em;white-space:pre-wrap;overflow-wrap:break-word;position:relative}
.el.t-h{margin-top:2.4em;font-weight:700;scroll-margin-top:70px;cursor:default}
.el.t-h::before{content:attr(data-num);position:absolute;left:-3.2em;width:2.7em;text-align:right;font-weight:400;color:var(--dim)}
.el.t-h::after{content:attr(data-e8);position:absolute;right:-.9em;transform:translateX(100%);font:500 .72em var(--mono);color:var(--pgA);white-space:nowrap}
.el.t-c{margin-left:13.2em;width:22em}
.el.t-d{margin-left:6em;width:21em;margin-top:0}
.el.t-p{margin-left:9.6em;width:15.6em;margin-top:0}
.el.t-tr{text-align:right}
.el.flash{animation:fl 1.4s ease-out}
@keyframes fl{0%{background:var(--pgASoft)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.el.flash{animation:none;outline:2px solid var(--pgA)}}
.pb{width:36em;margin:1.6em 0 -.2em;border-top:1px dashed var(--line);text-align:right;font-size:.8em;color:var(--dim);padding-top:.25em;-webkit-user-select:none;user-select:none}
.pb::after{content:attr(data-pg) "."}
.split{width:46.15em;margin-top:1.8em;border-top:2px solid var(--pgA);padding-top:.4em;font:600 .78em var(--sans);color:var(--sub);display:flex;gap:.7em;align-items:baseline;-webkit-user-select:none;user-select:none;scroll-margin-top:70px;cursor:default}
.split::before{content:attr(data-num);color:var(--pgA);font-family:var(--mono)}
.split::after{content:attr(data-e8);margin-left:auto;font:500 1em var(--mono);color:var(--pgA)}
.split span{font-weight:400;color:var(--dim)}
.hl{border-radius:2px}
.hc0{background:var(--hl0)}.hc1{background:var(--hl1)}.hc2{background:var(--hl2)}.hc3{background:var(--hl3)}
.tg{border-bottom:.16em solid var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent);border-radius:2px 2px 0 0}
.tg.hl{background:none}.tg.hc0{background:var(--hl0)}.tg.hc1{background:var(--hl1)}.tg.hc2{background:var(--hl2)}.tg.hc3{background:var(--hl3)}
.nt{border-bottom:.12em dotted var(--note)}
.nt.tg{border-bottom:.16em solid var(--tc)}
[data-a]{cursor:pointer}
.nend::after{content:"";display:inline-block;width:.5em;height:.5em;border-radius:1px;background:var(--note);margin-left:.12em;vertical-align:.5em}
#zoom{position:absolute;right:14px;bottom:14px;display:flex;gap:4px;z-index:6}
#dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(640px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;z-index:8;-webkit-user-select:none;user-select:none;max-height:60%;overflow:auto}
#dock[hidden]{display:none}
.dkRow{display:flex;align-items:center;gap:8px;margin-top:8px;min-width:0}
.dkRow:first-child{margin-top:0}
.dkQ{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:12.5px var(--script);color:var(--sub)}
.lab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);font-weight:600;white-space:nowrap}
.dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);flex:none;padding:0}
.dot.on{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 10px 4px 8px;white-space:nowrap;font-size:12px;flex:none}
.chip i{width:9px;height:9px;border-radius:2px;background:var(--tc);flex:none}
.chip:hover{border-color:var(--dim)}
.chip .x{border:0;background:transparent;padding:0 0 0 2px;color:var(--dim);font-size:14px;line-height:1}
.chip.auto{border-style:dashed}
.in{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:6px 8px}
textarea.in{resize:vertical;min-height:58px;line-height:1.4}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:11px 2px 9px;font-size:12.5px;font-weight:500;color:var(--sub);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
#panel{overflow:auto;flex:1;padding:12px 14px 30px}
.pTitle{font-weight:700;font-size:14px;line-height:1.3}
.pSub{color:var(--sub);font-size:12px;margin:2px 0 10px}
.f{margin:10px 0}
.f>label{display:block;font-size:11px;color:var(--sub);margin-bottom:3px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.kv span:first-child{color:var(--sub)}

<script>
/* ============================================================
   Parsing: text / Fountain, Final Draft (.fdx), PDF
   Elements: {t,x,pg,row,n,num}  t: h heading, a action, c character, d dialogue, p parenthetical, tr transition
   ============================================================ */
const HEAD=/^(?:(\d+[A-Z]{0,2})\.?\s+)?((?:INT|EXT|EST|I\/E)(?:\.|(?=[\s\/]))(?:\s*\/\s*(?:INT|EXT)\.?)?)\s*(.*?)\s*$/;
const isUpper=s=>s===s.toUpperCase()&&/[A-Z]/.test(s);
const isCue=s=>isUpper(s)&&s.length<=42&&!/[.!?,:;]$/.test(s.replace(/\(.*?\)\s*\^?$/,'').trim())&&!HEAD.test(s);
const JUNK=/^(\(?CONTINUED\)?:?(\s*\(\d+\))?|\(MORE\)|\(CONT(INUED|'D)\))$/i;
function headEl(s,raw){const m=s.match(HEAD);if(!m)return null;let x=(m[2]+' '+m[3]).replace(/\s+/g,' ').trim(),num=m[1]||'';
  const t=x.match(/^(.*?)\s+(\d+[A-Z]{0,2})\.?$/);if(t&&(t[2]===num||(raw&&/\s{3,}\d+[A-Z]{0,2}\.?\s*$/.test(raw)))){x=t[1].trim();num=num||t[2];}
  return {t:'h',x,num};}
function parseSlug(x){const m=x.match(/^(INT\.?\s*\/\s*EXT\.?|EXT\.?\s*\/\s*INT\.?|I\/E\.?|INT\.?|EXT\.?|EST\.?)\s*[-.:]?\s*(.*)$/);if(!m){const k0=Math.max(x.lastIndexOf(' - '),x.lastIndexOf(' – '),x.lastIndexOf(' — '));return k0>0?{ie:'',set:x.slice(0,k0).trim(),tod:x.slice(k0+3).trim()}:{ie:'',set:x,tod:''};}
  let ie=m[1].replace(/\s+/g,'').replace(/\.$/,'').toUpperCase();if(ie==='I/E')ie='INT/EXT';ie=ie.replace(/\./g,'');let rest=m[2].trim(),tod='';const k=Math.max(rest.lastIndexOf(' - '),rest.lastIndexOf(' – '),rest.lastIndexOf(' — '));
  if(k>0){tod=rest.slice(k+3).trim();rest=rest.slice(0,k).trim();}return {ie,set:rest,tod};}
const cueName=x=>x.replace(/\s*\([^)]*\)\s*/g,' ').replace(/\^\s*$/,'').replace(/\s+/g,' ').trim();

/* ---- plain text / Fountain ---- */
function parseText(txt){const lines=txt.replace(/\r/g,'').replace(/\t/g,'    ').split('\n');const els=[];let i=0,title='';
  if(/^\s*(title|credit|author|authors|source|draft date|contact)\s*:/i.test(lines[0]||'')){for(;i<lines.length&&lines[i].trim()!=='';i++){const m=lines[i].match(/^\s*title\s*:\s*(.*)/i);if(m)title=m[1].replace(/[_*]/g,'').trim();}}
  const blank=k=>k<0||k>=lines.length||!lines[k].trim();
  for(;i<lines.length;i++){let s=lines[i].trim();if(!s||JUNK.test(s)||/^\d+\.?$/.test(s)&&blank(i-1)&&blank(i+1))continue;const last=els[els.length-1];const pb=blank(i-1),nb=blank(i+1);
    if(s[0]==='.'&&s[1]&&s[1]!=='.'){const m=s.slice(1).match(/^(.*?)\s*(?:#([^#]+)#)?$/);els.push({t:'h',x:m[1].trim(),num:m[2]||''});continue;}
    if(pb){const fm=s.match(/\s*#([^#]+)#\s*$/);const h=headEl(fm?s.slice(0,fm.index):s);if(h){if(fm)h.num=fm[1].trim();els.push(h);continue;}}
    if(s[0]==='>'&&!/<$/.test(s)){els.push({t:'tr',x:s.slice(1).trim()});continue;}
    if(pb&&isUpper(s)&&/(TO:|FADE OUT\.?|FADE IN:|CUT TO BLACK\.?)$/.test(s)&&s.length<32){els.push({t:'tr',x:s});continue;}
    if(s[0]==='@'&&pb&&!nb){els.push({t:'c',x:s.slice(1).trim()});continue;}
    if(pb&&!nb&&isCue(s)){els.push({t:'c',x:s});continue;}
    if(last&&!pb&&(last.t==='c'||last.t==='p'||last.t==='d')){if(/^\(.*\)$/.test(s))els.push({t:'p',x:s});else if(last.t==='d')last.x+=' '+s;else els.push({t:'d',x:s});continue;}
    if(s[0]==='!')s=s.slice(1);
    if(last&&last.t==='a'&&!pb)last.x+=' '+s;else els.push({t:'a',x:s});}
  paginate(els);return {els,title,R:54};}

    if(a.k==='hl')body=`<div class="dkRow"><span class="lab">Color</span>${dots(a.c).replace(/data-d="hl"/g,`data-d="recolor" data-id="${a.id}"`)}<select class="in" data-ly="${a.id}" style="flex:0 1 150px;margin-left:auto" aria-label="Layer">${lyOpts(lyOf(a))}</select></div>`;
    else if(a.k==='cut')body=`<div class="dkRow"><textarea class="in" data-nf="${a.id}" rows="2" placeholder="Why it was cut, or what was said instead" aria-label="Note about the cut">${esc(a.x||'')}</textarea></div>`;
    else if(a.k==='note')body=`<div class="dkRow"><select class="in" data-ty="${a.id}" aria-label="Note type">${ntOpts(tyOf(a))}</select><select class="in" data-ly="${a.id}" aria-label="Layer">${lyOpts(lyOf(a))}</select></div><div class="dkRow"><textarea class="in" data-nf="${a.id}" rows="3" placeholder="Write your note" aria-label="Note">${esc(a.x||'')}</textarea></div>`;
    else{const m=findMatches(a).length;body=`<div class="dkRow"><select class="in" data-tc="${a.id}" style="flex:0 0 150px" aria-label="Category">${CATS.map(([c,nm])=>`<option value="${c}" ${c===a.cat?'selected':''}>${esc(nm)}</option>`).join('')}</select><input class="in" data-tn="${a.id}" value="${esc(a.name)}" aria-label="Element name"></div>${m?`<div class="dkRow"><button class="btn sm" data-d="tagall" data-id="${a.id}">Review ${m} other place${m===1?'':'s'} this word appears…</button></div>`:''}`;}
    return `<div class="dkRow"${n?' style="border-top:1px solid var(--line);padding-top:8px"':''}><span class="lab" style="color:${a.k==='tag'?CAT[a.cat].color:a.k==='note'?'var(--note)':'var(--sub)'}">${a.k==='hl'?'Highlight':a.k==='note'?'Note':a.k==='cut'?'Cut on the day':'Tag'}</span><span class="dkQ">“${esc(a.q)}”</span><button class="btn sm danger" data-d="del" data-id="${a.id}">Remove</button>${n?'':closeBtn}</div>${a.flag?`<div class="dkRow"><span class="pill rvC">text changed</span><span class="dkQ">was “${esc(a.was||'')}”</span><button class="btn sm" data-d="ack" data-id="${a.id}">Looks right</button></div>`:''}${body}`;}).join('');
  if(focus){const f=d.querySelector('textarea,input');if(f)setTimeout(()=>{f.focus();if(f.select&&f.tagName==='INPUT')f.select();},30);}}
function reviewMatches(a){const ms=findMatches(a);if(!ms.length)return;const word=annoText(a);
  openModal(`<h3>Other places “${esc(word)}” appears</h3><div class="pSub">Tick only the places that mean the same ${esc(CAT[a.cat].name.toLowerCase())} element, <b>${esc(a.name)}</b>. Untick any where the word means something else; those stay untagged and you can tag them separately.</div>
   <div style="display:flex;gap:6px;margin-bottom:8px;align-items:center"><button class="btn sm" id="mAll">Tick all</button><button class="btn sm" id="mNone">Untick all</button><span class="pSub" id="mCount" style="margin:0 0 0 auto"></span></div>
   <div id="mList">${ms.map((m,i)=>{const e=S.els[m.s[0]];const sc=SC[elSc[m.s[0]]];const pre=e.x.slice(Math.max(0,m.s[1]-48),m.s[1]),post=e.x.slice(m.t[1],m.t[1]+48);return `<label class="mRow"><input type="checkbox" data-mi="${i}" checked><span class="n">${sc?'Sc '+esc(sc.num):'Front'}<small>p.${e.pg}</small></span><span class="c">${m.s[1]>48?'…':''}${esc(pre)}<mark>${esc(m.q)}</mark>${esc(post)}${e.x.length>m.t[1]+48?'…':''}</span></label>`;}).join('')}</div>
   <div class="mFoot"><button class="btn" data-close>Cancel</button><button class="btn pri" id="mGo">Tag ticked places</button></div>`,true);
  const boxes=()=>[...document.querySelectorAll('#mList input')];const upd=()=>{const n=boxes().filter(b=>b.checked).length;$('#mCount').textContent=`${n} of ${ms.length} ticked`;$('#mGo').disabled=!n;};upd();
  $('#mList').onchange=upd;$('#mAll').onclick=()=>{boxes().forEach(b=>b.checked=true);upd();};$('#mNone').onclick=()=>{boxes().forEach(b=>b.checked=false);upd();};
  $('#mGo').onclick=()=>{const pick=boxes().filter(b=>b.checked).map(b=>ms[+b.dataset.mi]);if(!pick.length)return;pushUndo();pick.forEach(m=>S.an.push({id:'a'+uid(),k:'tag',cat:a.cat,name:a.name,s:m.s,t:m.t,q:m.q}));closeModal();renderAll(true);scheduleSave();openCard(cardIds);toast(`Tagged ${pick.length} more place${pick.length===1?'':'s'}`);};}
const dock=$('#dock');
dock.addEventListener('pointerdown',e=>{dockTouch=Date.now();if(!e.target.closest('input,textarea,select'))e.preventDefault();});
dock.addEventListener('click',e=>{dockTouch=Date.now();const b=e.target.closest('[data-d]');if(!b)return;const d=b.dataset.d,a=b.dataset.id?S.an.find(x=>x.id===b.dataset.id):null;
  if(d==='close'){hideDock();return;}
  if(d==='cats'){openCats();return;}
  if(d==='hl'&&curSel){addAnno({k:'hl',c:+b.dataset.c});window.getSelection().removeAllRanges();hideDock();return;}
  if(d==='beat'&&curSel){let i=curSel.s[0];while(i>0&&(S.els[i].t==='d'||S.els[i].t==='p'))i--;window.getSelection().removeAllRanges();hideDock();beatDialog(null,i);return;}
  if(d==='scene'&&curSel){let i=curSel.s[0];const E=S.els;const text=curSel.full.replace(' … ',' ').replace(/\s+/g,' ').trim();const whole=i===curSel.t[0]&&text.length>=E[i].x.replace(/\s+/g,' ').trim().length-2;while(i>0&&(E[i].t==='d'||E[i].t==='p'))i--;window.getSelection().removeAllRanges();hideDock();
    if(S.unhead[i]){pushUndo();delete S.unhead[i];renderAll(true);setCur(elSc[i],false);scheduleSave();toast('Scene heading restored');return;}
    if(E[i].t==='h'||(elSc[i]>=0&&SC[elSc[i]].i===i&&SC[elSc[i]].manual)){toast('That line is already a scene heading');return;}
    pushUndo();let slug=text.slice(0,100),num='';const m=slug.match(/^(\d+[A-Z]{0,2})\.?\s+(.*?)\s+\1\.?$/);if(m){num=m[1];slug=m[2];}S.splits[i]={m:1,slug,whole};delete S.sc['x'+i];if(num)S.sc['x'+i]={num};
    renderAll(true);const k=elSc[i];setCur(k,false);V.tab='scene';if(!V.narrow&&!V.side){V.side=true;applyUI();}renderSide();scheduleSave();toast(`Scene ${SC[k].num} added. Check its number and heading on the Scene tab.`,4500);return;}
  if(d==='split'&&curSel){let i=curSel.s[0];const E=S.els;while(i>0&&(E[i].t==='d'||E[i].t==='p'))i--;window.getSelection().removeAllRanges();hideDock();
    if(elSc[i]<0){toast('That text comes before the first scene heading');return;}if((E[i].t==='h'&&!S.unhead[i])||SC[elSc[i]].i===i){toast('A scene already starts there');return;}
    pushUndo();S.splits[i]=1;renderAll(true);const k=elSc[i];setCur(k,false);V.tab='scene';renderSide();scheduleSave();toast(`Scene split: ${SC[k-1].num} and ${SC[k].num}. Join them again from the Scene tab.`,4500);return;}
  if(d==='setup'&&curSel){const E=S.els;let e0=curSel.s[0],o0=curSel.s[1],e1=curSel.t[0],o1=curSel.t[1];const ws=c=>!c||/\s/.test(c);while(e0<e1&&!E[e0].x.slice(o0).trim()){e0++;o0=0;}while(e1>e0&&!E[e1].x.slice(0,o1).trim()){e1--;o1=E[e1].x.length;}while(o0<E[e0].x.length&&ws(E[e0].x[o0]))o0++;while(o1>0&&ws(E[e1].x[o1-1]))o1--;if(e0===e1&&o1<=o0){o0=0;o1=E[e1].x.length;}if(o1>=E[e1].x.length)o1=null;window.getSelection().removeAllRanges();hideDock();setupDialog(null,{e0,e1,o0,o1});return;}
  if(d==='dcut'&&curSel){const n=addAnno({k:'cut',x:''});window.getSelection().removeAllRanges();if(n)openCard([n.id],true);return;}
  if(d==='note'&&curSel){const n=addAnno({k:'note',x:''});window.getSelection().removeAllRanges();if(n)openCard([n.id],true);return;}
  if(d==='tag'&&curSel){const cat=b.dataset.cat;const name=cleanName(curSel.full.replace(' … ',' '),cat);if(!name){toast('Select a word or phrase to tag');return;}const n=addAnno({k:'tag',cat,name});window.getSelection().removeAllRanges();if(n){openCard([n.id]);toast(`Tagged “${name}” as ${CAT[cat].name}`);}return;}
  if(!a)return;
  if(d==='ack'){pushUndo();delete a.flag;delete a.was;scheduleSave();openCard(cardIds);renderSide();return;}
  if(d==='recolor'){pushUndo();a.c=+b.dataset.c;light(a.s[0],a.t[0]);scheduleSave();openCard(cardIds);return;}
  if(d==='del'){pushUndo();S.an=S.an.filter(x=>x!==a);reindex();light(a.s[0],a.t[0]);scheduleSave();openCard(cardIds.filter(i=>i!==a.id));return;}
  if(d==='tagall'){reviewMatches(a);return;}});
dock.addEventListener('input',e=>{const t=e.target;if(t.dataset.nf){const a=S.an.find(x=>x.id===t.dataset.nf);if(a){if(!t._u){pushUndo();t._u=1;}a.x=t.value;scheduleSave();}}});
dock.addEventListener('change',e=>{const t=e.target;if(t.dataset.nf){if(V.tab==='notes')renderSide();return;}
  if(t.dataset.ty||t.dataset.ly){const n=S.an.find(x=>x.id===(t.dataset.ty||t.dataset.ly));if(!n)return;pushUndo();if(t.dataset.ty){n.ty=t.value;V.lastTy=t.value;saveUI();renderSide();}else{n.ly=t.value;reindex();light(n.s[0],n.t[0]);if(!vis(n)){hideDock();toast('Moved to a hidden layer');}}scheduleSave();return;}
  const id=t.dataset.tc||t.dataset.tn;const a=id&&S.an.find(x=>x.id===id);if(!a)return;pushUndo();if(t.dataset.tc)a.cat=t.value;else{const n=cleanName(t.value,a.cat);if(!n){t.value=a.name;return;}a.name=n;t.value=n;}light(a.s[0],a.t[0]);scheduleSave();if(t.dataset.tc)openCard(cardIds);});
$('#page').addEventListener('click',e=>{const sel=window.getSelection();if(sel&&!sel.isCollapsed)return;const bt=e.target.closest('.beat');if(bt){const b=S.beats.find(x=>x.id===bt.dataset.b);if(b)beatDialog(b);return;}const sp=e.target.closest('[data-a]');if(sp){openCard(sp.dataset.a.split(','),false);return;}if(dockMode==='card')hideDock();const h=e.target.closest('.t-h');if(h)setCur(elSc[+h.dataset.i],false);const sp2=e.target.closest('.split');if(sp2)setCur(+sp2.dataset.k,false);});

function scState(s){return S.sc[s.key]||(S.sc[s.key]={});}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b){V.tab=b.dataset.t;saveUI();renderSide();}});
$('#panel').addEventListener('input',e=>{const t=e.target,s=SC[cur];if(t.dataset.gx){const n=S.gn.find(x=>x.id===t.dataset.gx);if(n){if(!t._u){pushUndo();t._u=1;}n.x=t.value;scheduleSave();}return;}if(t.dataset.sf==='dayNote'&&s){if(!t._u){pushUndo();t._u=1;}const st=scState(s);if(t.value)st.dayNote=t.value;else delete st.dayNote;scheduleSave();return;}if(t.dataset.sf==='syn'&&s){if(!t._u){pushUndo();t._u=1;}scState(s).syn=t.value;s.syn=t.value;scheduleSave();}});
$('#panel').addEventListener('change',e=>{const t=e.target,s=SC[cur];
  if(t.dataset.gt){const n=S.gn.find(x=>x.id===t.dataset.gt);if(n){pushUndo();n.ty=t.value;V.lastTy=t.value;saveUI();scheduleSave();}return;}
  if(t.dataset.ntf){V.noteTy=t.value;renderSide();return;}
  if(!s)return;
  if(t.dataset.sf==='ov'){const v=parse8(t.value);if(!(v>0)){toast('Type a length like 1 3/8, 5/8 or 2');t.value=fmt8(s.e8);return;}pushUndo();const st=scState(s);if(v===s.meas)delete st.ov;else st.ov=v;light();scheduleSave();}
  if(t.dataset.sf==='syn'){renderNav();renderReport();}
  if(t.dataset.sf==='status'){pushUndo();const st=scState(s);if(t.value)st.status=t.value;else delete st.status;renderNav();renderReport();scheduleSave();return;}
  if(t.dataset.sf==='slug'&&s.manual){const v=t.value.replace(/\s+/g,' ').trim();if(!v){t.value=s.slug;return;}pushUndo();S.splits[s.i].slug=v;renderAll(true);scheduleSave();return;}
  if(t.dataset.sf==='num'){const v=t.value.trim().slice(0,12);pushUndo();const st=scState(s);if(v)st.num=v;else delete st.num;light();scheduleSave();}});
$('#panel').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='addName'){e.preventDefault();$('#panel [data-act="addEl"]').click();}});
$('#panel').addEventListener('click',e=>{const s=SC[cur];
  const gd=e.target.closest('[data-gdel]');if(gd){pushUndo();S.gn=S.gn.filter(n=>n.id!==gd.dataset.gdel);renderSide();scheduleSave();return;}
  const bed=e.target.closest('[data-bed]');if(bed){const b=S.beats.find(x=>x.id===bed.dataset.bed);if(b)beatDialog(b);return;}
  const bgo=e.target.closest('[data-bgo]');if(bgo){const b=S.beats.find(x=>x.id===bgo.dataset.bgo);if(b){goEl(b.i,true);if(V.narrow){V.side=false;applyUI();}}return;}
  const cgo=e.target.closest('[data-cgo]');if(cgo){goEl(+cgo.dataset.cgo,true);if(V.narrow){V.side=false;applyUI();}return;}
  const nf=e.target.closest('[data-nf]');if(nf){V.noteFilter=nf.dataset.nf;saveUI();renderSide();return;}
  const go=e.target.closest('[data-go]');if(go){const a=S.an.find(x=>x.id===go.dataset.go);if(a){goEl(a.s[0],true);openCard([a.id],false);if(V.narrow){V.side=false;applyUI();}}return;}
  const el=e.target.closest('[data-el]');if(el){const [c,k]=el.dataset.el.split('|');elementDialog(c,k);return;}
  const rm=e.target.closest('[data-rm]');if(rm&&s){const [c,k]=rm.dataset.rm.split('|');pushUndo();const st=scState(s);if(st.els)st.els=st.els.filter(x=>!(x.cat===c&&keyOf(x.name)===k));const before=S.an.length;S.an=S.an.filter(a=>!(a.k==='tag'&&a.cat===c&&keyOf(a.name)===k&&elSc[a.s[0]]===cur));if(S.an.length!==before){reindex();light(s.i,s.end);}else light();scheduleSave();return;}
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  if(prodAct(act,b))return;
  if(revAct(act,b))return;
  if(act==='unhead'&&s&&!s.split&&!s.manual){pushUndo();const st=S.sc[s.key];const prev=SC[cur-1];if(st&&st.els&&st.els.length&&prev){const ps=scState(prev);ps.els=(ps.els||[]).concat(st.els);}delete S.sc[s.key];S.unhead[s.i]=1;cur=Math.max(0,cur-1);renderAll(true);scheduleSave();toast('That line is now ordinary action. Undo, or mark it as a scene heading again, to bring it back.',4500);return;}
  if(act==='unsplit'&&s&&(s.split||s.manual)){pushUndo();const prev=SC[cur-1];const st=S.sc[s.key];if(st&&st.els&&st.els.length&&prev){const ps=scState(prev);ps.els=(ps.els||[]).concat(st.els);}delete S.sc[s.key];delete S.splits[s.i];cur=Math.max(0,cur-1);renderAll(true);scheduleSave();toast(s.manual?'Scene start removed':'Parts joined');return;}
  if(act==='resetLen'&&s){pushUndo();delete scState(s).ov;light();scheduleSave();}
  if(act==='addEl'&&s){const cat=$('#addCat').value;const name=cleanName($('#addName').value,cat);if(!name){toast('Type the element’s name first');return;}pushUndo();const st=scState(s);(st.els||(st.els=[])).push({cat,name});light();scheduleSave();const f=$('#addName');if(f)f.focus();}
  if(act==='summary')openSummary();
  if(act==='noteTypes')openNoteTypes();
  if(act==='addScriptNote')addGn('script');
  if(act==='addSceneNote'&&s)addGn('scene',s.key);
  if(act==='cats')openCats();});
function elementDialog(c,k){const o=allEls()[c]&&allEls()[c].get(k);if(!o)return;openModal(`<h3>${esc(CAT[c].name)}: ${esc(o.name)}</h3><div class="pSub">Appears in ${o.scenes.length} scene${o.scenes.length===1?'':'s'}: ${esc(o.scenes.join(', '))}</div>
  <div class="f"><label for="elName">Name</label><input class="in" id="elName" value="${esc(o.name)}"></div><div class="f"><label for="elCat">Category</label><select class="in" id="elCat">${CATS.map(([cc,n])=>`<option value="${cc}" ${cc===c?'selected':''}>${esc(n)}</option>`).join('')}</select></div>
  <div class="pSub">Renaming or moving it changes every tag of this element. Characters who are listed only because they speak can’t be renamed here; that comes from the script text.</div>
  <div class="mFoot"><button class="btn danger" id="elDel">Remove everywhere</button><button class="btn" data-close>Cancel</button><button class="btn pri" id="elSave">Save</button></div>`);
  const each=fn=>{S.an.forEach(a=>{if(a.k==='tag'&&a.cat===c&&keyOf(a.name)===k)fn(a);});Object.values(S.sc).forEach(st=>(st.els||[]).forEach(x=>{if(x.cat===c&&keyOf(x.name)===k)fn(x);}));};
  $('#elSave').onclick=()=>{const nc=$('#elCat').value,nn=cleanName($('#elName').value,nc);if(!nn)return;pushUndo();each(x=>{x.name=nn;x.cat=nc;});closeModal();renderAll(true);scheduleSave();};
  $('#elDel').onclick=()=>{pushUndo();S.an=S.an.filter(a=>!(a.k==='tag'&&a.cat===c&&keyOf(a.name)===k));Object.values(S.sc).forEach(st=>{if(st.els)st.els=st.els.filter(x=>!(x.cat===c&&keyOf(x.name)===k));});closeModal();renderAll(true);scheduleSave();};}

/* ============================================================
   Undo
   ============================================================ */
let undoStack=[];
function pushUndo(){undoStack.push(JSON.stringify({an:S.an,sc:S.sc,splits:S.splits,unhead:S.unhead,gn:S.gn,beats:S.beats,setups:S.setups,lost:S.lost}));if(undoStack.length>60)undoStack.shift();$('#bUndo').disabled=false;}
function undo(){if(!undoStack.length)return;const o=JSON.parse(undoStack.pop());S.an=o.an;S.sc=o.sc;S.splits=o.splits||{};S.unhead=o.unhead||{};S.gn=o.gn||[];S.beats=o.beats||[];S.setups=o.setups||[];S.lost=o.lost||[];$('#bUndo').disabled=!undoStack.length;hideDock();renderAll(true);scheduleSave();}
$('#bUndo').onclick=undo;
document.addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);if(e.key==='Escape'){if($('#modal').classList.contains('open'))closeModal();else if(typing)document.activeElement.blur();else hideDock();$('#moreMenu').classList.remove('open');return;}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();undo();}});

function openModal(html,wide){const mb=$('#modalBox');mb.onclick=null;mb.oninput=null;mb.onchange=null;mb.style.width=wide?'min(820px,100%)':'';mb.innerHTML=html;$('#modal').classList.add('open');}
function closeModal(){if(typeof importMode!=='undefined')importMode=null;$('#modal').classList.remove('open');}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('[data-close]'))closeModal();});
let toastT;function toast(t,ms){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),ms||2600);}
function showText(title,txt){openModal(`<h3>${esc(title)}</h3><textarea class="in" style="height:300px;font:12px var(--mono)" readonly>${esc(txt)}</textarea><div class="mFoot"><button class="btn pri" data-close>Close</button></div>`);}
function copyText(txt,msg){if(!txt){toast('Nothing to copy yet');return;}navigator.clipboard.writeText(txt).then(()=>toast(msg||'Copied'),()=>showText('Copy this text',txt));}
const slug=s=>String(s||'script').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50)||'script';
let DL=null;
async function saveFile(name,data){if(DL){try{await DL.save({filename:name,data});toast('Saved '+name);return;}catch(e){if(e&&(e.code==='declined'||e.code==='rate_limited'))return;}}
  if(!(window.claude&&window.claude.use)){try{const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:'text/plain'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);toast('Saved '+name);return;}catch(e){}}

function openHelp(){openModal(`<h3>How it works</h3><div style="line-height:1.6">
 <p><b>Lighting Plot.</b> <b>More → Send to the Lighting Plot</b> packs scenes, their sides and your camera setups into one file. Import it from the plot’s Shot list and each camera setup arrives as a shot linked to its lines, ready for you to place the camera and lights.</p>
 <p><b>For the editor.</b> Open a setup to log its takes, circle the ones to print and add continuity notes. Select words and choose <b>Cut on the day</b> to strike lines that were dropped. <b>More → Editor’s package</b> then downloads the lined script with facing pages, a takes log and a list of shoot-day changes.</p>
 <p><b>New drafts.</b> <b>More → Import a new draft</b> compares a revised script with the one that is open and moves your highlights, notes, tags, camera setups and scene details onto the matching lines. Notes on rewritten lines are flagged for review, notes on cut lines are kept in a list, and the earlier draft stays in My scripts.</p>
 <p><b>Line the script.</b> Highlight exactly what one camera setup covers and choose <b>Line as a camera setup</b>. A labeled line runs down the script from the first word you highlighted to the last. The Scene tab lists each scene’s camera setups and tells you what has no coverage yet.</p>
 <p><b>Make sides.</b> <b>More → Make sides</b> lets you tick the scenes for a shoot day and download a PDF of just those pages, with the other scenes crossed out. Days are saved so you can come back to them.</p>
 <p><b>Import.</b> Bring in a PDF, a Final Draft file (.fdx), a Fountain file, or pasted text. Scenes are found from their INT./EXT. headings and each one is measured in eighths of a page.</p>
 <p><b>Mark up.</b> Select any words in the script. A bar appears with highlight colors, <b>Add note</b>, and the breakdown categories. Click a marked passage to edit or remove it.</p>
 <p><b>Tag elements.</b> Tagging a word adds that element to the scene’s breakdown sheet. After the first tag you can review every other place the same word appears and tick only the ones that mean the same thing. Each tag can also be renamed, moved to another category or removed on its own. Characters who speak are listed as cast automatically.</p>
 <p><b>Break down.</b> The <b>Scene</b> tab is the breakdown sheet for the scene you are reading: length, synopsis and elements. The <b>Breakdown</b> view lists every scene, location and element, and exports to CSV.</p>
 <p><b>Give notes.</b> Each note has a type (story, character, pacing…) and sits on a layer. Add notes on a whole scene from the Scene tab, and on the whole script from the Notes tab. <b>Notes summary</b> compiles everything by page, scene or type, ready to copy or download.</p>
 <p><b>Layers.</b> The Layers button under the script shows or hides each set of notes and picks which layer new markup goes on.</p>
 <p><b>Story.</b> Select a line and choose <b>Add story beat</b> to mark a turn. The Story tab shows where each beat falls and counts scenes and speeches per character.</p>
 <p><b>Fix a missed scene.</b> If the import skipped a scene, select its heading line and choose <b>Mark as scene heading</b>. If a line was wrongly read as a heading, open that scene and choose <b>Not a scene heading</b>.</p>
 <p><b>Split a scene.</b> Select the first words of the new part and choose <b>Split into parts here</b>. Scene 4 becomes 4A and 4B, each with its own length, cast and elements. You can type any scene number on the Scene tab, and join parts again there.</p>
 <p><b>Eighths.</b> Lengths are measured from where each scene starts and ends on the page. If your count differs, type your own length on the Scene tab; the totals follow.</p></div>

function charStats(){const m=new Map();const E=S.els;E.forEach((e,i)=>{if(e.t!=='c')return;const n=cueName(e.x);if(!n)return;const k=keyOf(n);let o=m.get(k);if(!o){o={name:n,sp:0,sc:new Set(),pg:e.pg,i,lines:0};m.set(k,o);}o.sp++;if(elSc[i]>=0)o.sc.add(elSc[i]);for(let j=i+1;j<E.length&&(E[j].t==='d'||E[j].t==='p');j++)if(E[j].t==='d')o.lines+=E[j].n;});return [...m.values()].sort((a,b)=>b.sp-a.sp);}
function panelStory(){const E=S.els;if(!E.length)return `<div class="pSub">Import a script to see its structure.</div>`;const R=S.R||54,abs=e=>(e.pg-1)*R+e.row,last=E[E.length-1],tot=Math.max(1,abs(last)+last.n),pages=last.pg;

function collectNotes(incHl){const out=[];S.an.forEach(a=>{if(a.k==='tag'||a.k==='cut'||!vis(a))return;if(a.k==='hl'&&!incHl)return;out.push({i:a.s[0],o:a.s[1],pg:S.els[a.s[0]].pg,sc:annoScene(a),ty:a.k==='note'?tyOf(a):null,q:a.q,x:a.k==='note'?a.x:'',hl:a.k==='hl'?HLN[a.c]:null});});
  S.gn.forEach(n=>{if(S.lyHidden[lyOf(n)]||!n.x.trim())return;if(n.scope==='scene'){const sc=SC.find(s=>s.key===n.key);if(sc)out.push({i:sc.i,o:-1,pg:sc.pg,sc,ty:tyOf(n),x:n.x,q:'',scene:true});}else out.push({i:-1,o:0,pg:0,sc:null,ty:tyOf(n),x:n.x,q:'',script:true});});
  return out.sort((a,b)=>a.i-b.i||a.o-b.o);}
function summaryBlocks(o){const items=collectNotes(o.hl);const B=[{t:'h1',x:`${S.title}: notes`},{t:'p',x:`${new Date().toLocaleDateString()} · ${LY.filter(l=>!S.lyHidden[l[0]]).map(l=>l[1]).join(', ')||'no layers shown'}`}];
  const line=(n,noTy)=>({t:'li',where:n.script?'':`p.${n.pg}${n.sc?', Sc '+n.sc.num:''}${n.scene?' (scene note)':''}`,ty:noTy?'':(n.ty?NTM[n.ty].name:n.hl+' highlight'),q:n.q,x:n.x||(n.hl?'':'(empty note)')});
  if(!items.length){B.push({t:'p',x:'No notes yet.'});return B;}
  if(o.order==='type'){NT.forEach(([id,name])=>{const g=items.filter(n=>n.ty===id);if(g.length){B.push({t:'h2',x:name});g.forEach(n=>B.push(line(n,true)));}});const hl=items.filter(n=>n.hl);if(hl.length){B.push({t:'h2',x:'Highlights'});hl.forEach(n=>B.push(line(n)));}return B;}
  const overall=items.filter(n=>n.script),rest=items.filter(n=>!n.script);if(overall.length){B.push({t:'h2',x:'Overall'});overall.forEach(n=>B.push(line(n)));}
  if(o.order==='scene'){let lastKey=null;rest.forEach(n=>{const key=n.sc?n.sc.key:'front';if(key!==lastKey){lastKey=key;B.push({t:'h2',x:n.sc?`Scene ${n.sc.num}: ${n.sc.slug}`:'Before the first scene'});}B.push(line(n));});}
  else if(rest.length){B.push({t:'h2',x:'Page by page'});rest.forEach(n=>B.push(line(n)));}
  return B;}
function blocksText(B){return B.map(b=>b.t==='h1'?b.x+'\n'+'='.repeat(Math.min(60,b.x.length)):b.t==='h2'?'\n'+b.x.toUpperCase():b.t==='p'?b.x:`• ${b.where?b.where+' — ':''}${b.ty?'['+b.ty+'] ':''}${b.q?'“'+b.q+'”':''}${b.x?(b.q?'\n    ':'')+b.x.replace(/\n/g,'\n    '):''}`).join('\n');}
function blocksHTML(B){return `<html><head><meta charset="utf-8"><title>${esc(S.title)} notes</title></head><body style="font-family:Calibri,Arial,sans-serif;font-size:11pt"><p style="font-family:'EB Garamond',Garamond,Georgia,serif;font-style:italic;font-size:13pt;color:#bd5103;margin:0 0 6pt">Clementine Films</p>`+B.map(b=>b.t==='h1'?`<h1 style="font-size:18pt">${esc(b.x)}</h1>`:b.t==='h2'?`<h2 style="font-size:13pt;margin-top:18pt">${esc(b.x)}</h2>`:b.t==='p'?`<p style="color:#666">${esc(b.x)}</p>`:`<p style="margin:0 0 8pt 0">${b.where?`<b>${esc(b.where)}</b> `:''}${b.ty?`<span style="color:#555">[${esc(b.ty)}]</span> `:''}${b.q?`<i>“${esc(b.q)}”</i>`:''}${b.x?(b.q?'<br>':'')+esc(b.x).replace(/\n/g,'<br>'):''}</p>`).join('')+'</body></html>';}

const STATUS=[['','Not scheduled'],['sched','Scheduled'],['part','Partly shot'],['shot','Shot']];
const LINE_COLS=['#c2410c','#1d4ed8','#15803d','#9333ea','#be123c','#0e7490','#a16207','#4338ca'];
const SIZES=['WS','MS','MCU','CU','OTS','2-shot','Insert','POV'];
const stOf=s=>(S.sc[s.key]||{}).status||'';
const absRow=e=>(e.pg-1)*(S.R||54)+e.row;
function suO0(u){const e=S.els[u.e0];return e?Math.max(0,Math.min(u.o0||0,e.x.length)):0;}
function suO1(u){const e=S.els[u.e1];if(!e)return 0;return u.o1==null?e.x.length:Math.max(0,Math.min(u.o1,e.x.length));}
function setupE8(u){const E=S.els;const a=E[u.e0],b=E[u.e1];if(!a||!b)return 0;const fa=a.x.length?suO0(u)/a.x.length:0,fb=b.x.length?suO1(u)/b.x.length:1;return Math.max(1,Math.round((absRow(b)+b.n*fb-absRow(a)-a.n*fa)*8/(S.R||54)));}
function elPoint(i,off,end){const host=elNode[i];if(!host)return null;const w=document.createTreeWalker(host,NodeFilter.SHOW_TEXT);let n,acc=0;while((n=w.nextNode())){const L=n.nodeValue.length;if(end?(off>acc&&off<=acc+L):(off>=acc&&off<acc+L)){const r=document.createRange();const o=off-acc;try{if(end){r.setStart(n,o-1);r.setEnd(n,o);}else{r.setStart(n,o);r.setEnd(n,o+1);}}catch(e){return null;}const rc=r.getClientRects();const q=rc.length?rc[end?rc.length-1:0]:null;const hb=host.getBoundingClientRect();if(!q||!q.height)return null;return {top:host.offsetTop+q.top-hb.top,bot:host.offsetTop+q.bottom-hb.top};}acc+=L;}return null;}
function setupsIn(k){return S.setups.filter(u=>elSc[u.e0]===k).sort((a,b)=>a.e0-b.e0||a.e1-b.e1);}
function uncovered(k){const s=SC[k];if(!s)return [];const out=[];for(let i=s.i;i<=s.end;i++){const t=S.els[i].t;if(t!=='a'&&t!=='d')continue;if(!S.setups.some(u=>u.e0<=i&&u.e1>=i))out.push(i);}return out;}
function nextSetupLabel(k){const s=SC[k];const n=setupsIn(k).length;const used=new Set(S.setups.map(u=>u.label.toLowerCase()));const mk=j=>/[A-Za-z]$/.test(s.num)?s.num+'-'+(j+1):s.num+(j<26?String.fromCharCode(65+j):'Z'+(j-25));let j=n;while(used.has(mk(j).toLowerCase()))j++;return mk(j);}
function snipAt(i,o,end){const x=S.els[i].x;if(end){const t=o==null?x:x.slice(0,o);return t.length>46?'…'+t.slice(-44):t;}const t=x.slice(o||0);return ((o||0)>0?'…':'')+(t.length>46?t.slice(0,44)+'…':t);}
function snip(i,fromEnd){const x=S.els[i].x;return fromEnd?(x.length>46?'…'+x.slice(-44):x):(x.length>46?x.slice(0,44)+'…':x);}

function renderLines(){const pg=$('#page');if(!pg||!S)return;let host=document.getElementById('lines');if(!host){host=document.createElement('div');host.id='lines';pg.appendChild(host);}
  if(!S.setups.length||S.linesHidden){host.innerHTML='';return;}const lanes={};let h='';
  S.setups.slice().sort((a,b)=>a.e0-b.e0||a.e1-b.e1).forEach(u=>{const n0=elNode[u.e0],n1=elNode[u.e1];if(!n0||!n1)return;const k=elSc[u.e0];const lane=(lanes[k]=(lanes[k]||0)+1)-1;const p0=suO0(u)>0?elPoint(u.e0,suO0(u),false):null,p1=u.o1!=null&&suO1(u)<S.els[u.e1].x.length?elPoint(u.e1,suO1(u),true):null;const top=p0?p0.top-1:n0.offsetTop,bot=p1?p1.bot+1:n1.offsetTop+n1.offsetHeight;

$('#page').addEventListener('click',e=>{const t=e.target.closest('.lnTag');if(!t)return;e.stopPropagation();const u=S.setups.find(x=>x.id===t.dataset.su);if(u)setupDialog(u);},true);
function setupDialog(u,range){const isNew=!u;if(isNew){const k=elSc[range.e0];if(k<0){toast('That text comes before the first scene heading');return;}u={id:'u'+uid(),label:nextSetupLabel(k),desc:'',e0:range.e0,e1:range.e1,o0:range.o0||0,o1:range.o1==null?null:range.o1,shot:false};}

    <div class="f"><label>Covers ${fmt8(setupE8({e0,e1,o0,o1}))} of a page in scene ${esc(s?s.num:'')}</label><div class="covBox"><div><span>From</span>${esc(snipAt(e0,o0,false))}</div><div><span>To</span>${esc(snipAt(e1,o1,true))}</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><button class="btn sm" id="suTop" ${s&&e0===s.i&&!o0?'disabled':''}>Start at the top of the scene</button><button class="btn sm" id="suEnd" ${s&&e1===s.end&&o1==null?'disabled':''}>Run to the end of the scene</button></div></div>

async function loadBody(id){let body=LS.get('sdesk.b.'+id);if(!body&&COL){try{const m=await COL.doc('m_'+id).get();if(m.exists){const d=m.data();let str='';for(let k=0;k<(d.chunks||0);k++){const c=await COL.doc('b_'+id+'_'+k).get();if(!c.exists)throw 0;str+=c.data().json;}body=JSON.parse(str);}}catch(e){body=null;}}return body?unpack(body):null;}
async function openCompare(){if(!S.prev){toast('This script was not imported as a new draft, so there is no earlier draft to compare it with.',5500);return;}
  toast('Loading the earlier draft…',15000);const old=await loadBody(S.prev);if(!old){toast('The earlier draft isn’t saved on this device or in your account, so it can’t be shown.',6000);return;}

  const rows=[];let i=0,j=0;const na=old.length,nb=nw.length;const emptyA=k=>A.range[k][0]===A.range[k][1],emptyB=k=>B.range[k][0]===B.range[k][1];
  while(i<na||j<nb){if(i<na&&emptyA(i)){i++;continue;}if(j<nb&&emptyB(j)){j++;continue;}if(i>=na){rows.push({as:[],bs:[j++]});continue;}if(j>=nb){rows.push({as:[i++],bs:[]});continue;}
    const ai=mA[i],bj=mB[j];if(ai<0){rows.push({as:[i++],bs:[]});continue;}if(bj<0){rows.push({as:[],bs:[j++]});continue;}
    if(ai===j||bj===i){const g={as:[i],bs:[j]};for(;;){if(i+1<na&&mA[i+1]===j&&!(j+1<nb&&mB[j+1]===i+1)){g.as.push(++i);}else if(j+1<nb&&mB[j+1]===i&&!(i+1<na&&mA[i+1]===j+1)){g.bs.push(++j);}else break;}rows.push(g);i++;j++;continue;}
    if(ai>j)rows.push({as:[],bs:[j++]});else rows.push({as:[i++],bs:[]});}
  const cell=(els,R,T,m,list,tag)=>list.map(k=>{const e=els[k];const [s,t]=R[k];let h='',pos=0;for(let q=s;q<t;q++){const tk=T[q];if(m[q]>=0)continue;let q2=q;while(q2+1<t&&m[q2+1]<0)q2++;const a=tk.o,b=T[q2].o+T[q2].l;h+=esc(e.x.slice(pos,a))+`<${tag}>${esc(e.x.slice(a,b))}</${tag}>`;pos=b;q=q2;}h+=esc(e.x.slice(pos));return `<div class="ce t-${e.t}"${tag==='ins'?` data-j="${k}"`:''}>${h}</div>`;}).join('');
  let nChg=0;const html=rows.map(r=>{const allA=r.as.every(k=>{const [s,t]=A.range[k];for(let q=s;q<t;q++)if(ma[q]<0)return false;return true;}),allB=r.bs.every(k=>{const [s,t]=B.range[k];for(let q=s;q<t;q++)if(mb[q]<0)return false;return true;});

const SAMPLE=`Title: The Last Ferry (sample)

FADE IN:

EXT. HARBOR - FERRY DOCK - DUSK

Gulls wheel over a rusted ferry. NORA VALE (30s), rain jacket zipped to her chin, drags a battered suitcase down the ramp. A DOCKHAND coils rope and watches her come.

DOCKHAND
Last boat's in ten minutes.

NORA
Then I've got nine to change my mind.

She pulls a creased envelope from her pocket, looks at the address, and puts it away again.

INT. FERRY - PASSENGER CABIN - CONTINUOUS

Rows of orange plastic seats. A vending machine hums. Nora takes a window seat and sets the suitcase on her knees.

Across the aisle, ELI (10) lines up toy cars on the armrest. His GRANDMOTHER dozes beside him under a wool blanket.

ELI
Is that a real suitcase?

NORA
As opposed to what?

ELI
(shrugging)
A spy one.

Nora almost smiles. She flips the latches. Inside: a brass ship's compass wrapped in a scarf, a stack of letters tied with string, and a child's yellow raincoat.

ELI (CONT'D)
That's not spy stuff.

NORA
No. It's worse.

EXT. FERRY - UPPER DECK - NIGHT

Wind and spray. Nora grips the rail with one hand, the compass in the other. The needle swings and settles. The lights of the island slide into view.

CAPTAIN MARSH (60s) steps out of the wheelhouse with two paper cups of coffee.

CAPTAIN MARSH
You're Tom Vale's girl.

NORA
I was.

He hands her a cup. They watch the island come on.

CAPTAIN MARSH
He kept your room. Thought you should know before you see it.

A foghorn sounds. Nora closes the compass with a click.

INT. VALE HOUSE - HALLWAY - NIGHT

Dark. A key turns. Nora steps in, dripping, and finds the light switch. A long hallway lined with framed nautical charts. A grey cat blinks at her from the stairs.

She sets down the suitcase, takes out the yellow raincoat, and hangs it on the lowest hook by the door. It still fits the hook.

NORA
(quietly)
Okay. I'm here.

The cat jumps down and follows her into the dark.

CUT TO:

EXT. VALE HOUSE - PORCH - DAWN

Grey light. Nora sits on the top step with the stack of letters, the string undone. She reads. The Dockhand's truck rattles past on the harbor road and gives one short honk.

She lifts a hand without looking up.

FADE OUT.
`;
